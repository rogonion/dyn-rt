[package]
name = "dyn-rt"
description = "dyn-rt dynamic runtime: one crate, per-module features (ADR 0003/0007/0010). Modules: path, schema, manipulation, reflect, json (JSON value model only), metadatamodel."
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
documentation = "https://docs.rs/dyn-rt"
keywords = ["dynamic-runtime", "jsonpath", "reflection", "schema", "metadata-model"]
categories = ["data-structures", "parsing", "encoding"]

[features]
default = ["json", "path", "schema", "manipulation", "reflect"]
# the JSON value model (Value/Number/JsonError) — dyn_rt::json
json = ["dep:dyn-rt-shared"]
path = ["dep:dyn-rt-path"]
schema = ["dep:dyn-rt-schema", "path", "reflect"]
manipulation = ["dep:dyn-rt-manipulation", "schema", "reflect"]
# text deserialization (serde json/yaml/toml) into reflect-able values
deser = ["dep:dyn-rt-schema", "dyn-rt-schema/deser"]
reflect = ["dep:dyn-rt-reflect", "dep:dyn-rt-shared"]
metadatamodel = ["dep:dyn-rt-metadatamodel", "manipulation"]

[[example]]
name = "schema_deser"
required-features = ["deser"]

[dependencies]
dyn-rt-manipulation = { path = "../../../libs/rust/manipulation", version = "0.1.0", optional = true }
dyn-rt-path = { path = "../../../libs/rust/path", version = "0.1.0", optional = true }
dyn-rt-schema = { path = "../../../libs/rust/schema", version = "0.1.0", optional = true }
dyn-rt-metadatamodel = { path = "../../../libs/rust/metadatamodel", version = "0.1.0", optional = true }
dyn-rt-reflect = { path = "../../../libs/rust/reflect", version = "0.1.0", optional = true }
dyn-rt-shared = { path = "../../../libs/rust/shared", version = "0.1.0", optional = true }

