[package]
name = "dyn-rt"
description = "dyn-rt dynamic runtime: one crate, per-module features (ADR 0003/0007). Groups: json (default), metadatamodel."
version.workspace = true
edition.workspace = true
license-file.workspace = true

[features]
default = ["json"]
json = ["json-path"]
json-path = ["dep:dyn-rt-json-path", "dep:dyn-rt-shared"]
# json-manipulation = ["dep:dyn-rt-json-manipulation", "json-path"]   # next module
# json-schema       = ["dep:dyn-rt-json-schema", "json-manipulation"]
# reflect           = ["dep:dyn-rt-reflect"]
# metadatamodel     = ["dep:dyn-rt-metadatamodel", "json"]

[dependencies]
dyn-rt-json-path = { path = "../../../libs/rust/json-path", optional = true }
dyn-rt-shared = { path = "../../../libs/rust/shared", optional = true }

[dev-dependencies]
dyn-rt-test-support = { path = "../../../libs/rust/test-support" }
serde_json = "1"
