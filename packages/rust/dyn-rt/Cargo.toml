[package]
name = "dyn-rt"
description = "dyn-rt dynamic runtime: one crate, per-module features (ADR 0003/0007). Groups: json (default), metadatamodel."
version.workspace = true
edition.workspace = true
license-file.workspace = true

[features]
default = ["json", "reflect"]
json = ["json-path", "json-schema"]
json-path = ["dep:dyn-rt-json-path", "dep:dyn-rt-shared"]
json-schema = ["dep:dyn-rt-json-schema", "json-path", "reflect"]
# text deserialization (serde json/yaml/toml) into reflect-able values
deser = ["dep:dyn-rt-json-schema", "dyn-rt-json-schema/deser"]
reflect = ["dep:dyn-rt-reflect", "dep:dyn-rt-shared"]
# json-manipulation = ["dep:dyn-rt-json-manipulation", "json-schema", "reflect"]  # next module
# metadatamodel     = ["dep:dyn-rt-metadatamodel", "json"]

[[example]]
name = "schema_deser"
required-features = ["deser"]

[dependencies]
dyn-rt-json-path = { path = "../../../libs/rust/json-path", optional = true }
dyn-rt-json-schema = { path = "../../../libs/rust/json-schema", optional = true }
dyn-rt-reflect = { path = "../../../libs/rust/reflect", optional = true }
dyn-rt-shared = { path = "../../../libs/rust/shared", optional = true }

