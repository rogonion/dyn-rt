[package]
name = "dyn-rt-schema"
description = "dyn-rt schema module: schema model (domain), validation + schema-path use cases (application), format deserialization adapters (adapters). Depends on reflect, path, shared."
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"

[features]
# Text deserialization adapters (serde formats). The serde crates are
# imported ONLY in src/adapters/deser.rs (ADR 0002), and only when the
# consumer opts in (ADR 0003). All formats parse into serde_json::Value,
# which participates in reflection via dyn-rt-reflect's serde-json adapter.
deser = [
    "dep:serde_json",
    "dep:serde_yaml",
    "dep:toml",
    "dyn-rt-reflect/serde-json",
]

[dependencies]
dyn-rt-shared = { path = "../shared", version = "1.0.0" }
dyn-rt-reflect = { path = "../reflect", version = "1.0.0" }
dyn-rt-path = { path = "../path", version = "1.0.0" }
# imported ONLY in src/adapters/deser.rs behind the deser feature
serde_json = { version = "1", optional = true }
serde_yaml = { version = "0.9", optional = true }
toml = { version = "0.8", optional = true }

[dev-dependencies]
dyn-rt-test-support = { path = "../test-support", version = "1.0.0" }
# enable the adapters under test when running this crate's own tests
dyn-rt-schema = { path = ".", features = ["deser"] }
