[package]
name = "dyn-rt-reflect-derive"
description = "Derive macros for dyn-rt-reflect (ADR 0008): Reflect (base, Unknown), ReflectStruct, ReflectEnum — per-shape, each emitting the base impl too."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
# de-facto proc-macro stack, sanctioned by ADR 0005
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
