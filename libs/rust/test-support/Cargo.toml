[package]
name = "dyn-rt-test-support"
description = "Dev-only test helpers: loads tests/shared JSON fixtures and converts serde_json <-> domain Value for tests. Never a runtime dependency (ADR 0004)."
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
dyn-rt-json-path = { path = "../json-path" }
dyn-rt-reflect = { path = "../reflect" }
dyn-rt-shared = { path = "../shared" }
serde_json = { version = "1", features = ["preserve_order"] }
