[package]
name = "dyn-rt-reflect"
description = "dyn-rt reflect module: general-purpose runtime reflection for Rust (go-reflect analogue). domain/application are std-only; adapters hold the Value/std impls."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[features]
# External-type adapters: the only place their crates may be imported
# (src/adapters/), and only when the consumer opts in (ADR 0002/0003).
serde-json = ["dep:serde_json"]

[dependencies]
# imported ONLY in src/adapters/ (impl Reflect for shared::Value)
dyn-rt-shared = { path = "../shared", version = "1.0.0" }
# derive macros, re-exported at the crate root (serde-style)
dyn-rt-reflect-derive = { path = "../reflect-derive", version = "1.0.0" }
# imported ONLY in src/adapters/serde_json.rs behind the serde-json feature
serde_json = { version = "1", optional = true }

[dev-dependencies]
dyn-rt-test-support = { path = "../test-support" }
# enable the adapter under test when running this crate's own tests
dyn-rt-reflect = { path = ".", features = ["serde-json"] }
